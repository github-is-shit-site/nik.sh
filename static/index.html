<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="The directory of nik.sh websites." />
    <title>nik.sh — Site Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/directory.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="nik.sh home">
        <span class="brand-mark">N</span>
        <span>nik.sh</span>
      </a>
      <span class="directory-label">Site directory</span>
      <span class="site-count">05 sites</span>
    </header>

    <main>
      <section class="directory" aria-labelledby="directory-title">
        <div class="directory-heading">
          <p>All websites</p>
          <h1 id="directory-title">nik.sh</h1>
        </div>
        <div class="site-grid" id="site-grid" aria-live="polite">
          <div class="loading-card">Loading directory...</div>
        </div>
      </section>
    </main>

    <footer>
      <span>nik.sh</span>
      <span>Site directory</span>
    </footer>
    <noscript>JavaScript is required to load the directory.</noscript>
    <script src="/directory.js" defer></script>
  </body>
</html>
